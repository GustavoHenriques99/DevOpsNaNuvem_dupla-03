
name: Publicar site e verificar status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Executar testes
        id: testes
        run: |
          pytest

      - name: Gerar página de status
        if: always()
        run: |
          mkdir -p site
          if [ "${{ steps.testes.outcome }}" = "success" ]; then
            STATUS="APROVADO"
          else
            STATUS="FALHOU"
          fi

          cat > site/status.html <<EOF
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <title>Status da API</title>
          </head>
          <body>
            <h1>Status da API</h1>
            <p>Resultado dos testes: $STATUS</p>
            <p>Commit: $GITHUB_SHA</p>
            <p>Data: $(date)</p>
          </body>
          </html>
          EOF

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
